<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c18">
  <title>Open in NELOA</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #090c18;
      color: #f5f3ff;
    }
    .card { max-width: 440px; padding: 28px; text-align: center; }
    p { color: #c0bfd1; line-height: 1.55; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      border-radius: 24px;
      background: #7a45ee;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>NELOA</h1>
    <p id="status">Opening the shared page in NELOA…</p>
    <a id="store-link" href="https://play.google.com/store/apps/details?id=com.neloa.app">
      Get NELOA on Google Play
    </a>
  </main>
  <script>
    (function () {
      // Preserve the same path, query string, and fragment used by the existing NELOA deep links.
      var path = location.pathname.replace(/^\/+/, "");
      var deepLink = "neloa://" + path + location.search + location.hash;

      // Pass the original HTTPS URL through Play Install Referrer for builds that support it.
      var referrer = "deep_link=" + encodeURIComponent(location.href);
      var storeUrl = "https://play.google.com/store/apps/details?id=com.neloa.app&referrer=" +
        encodeURIComponent(referrer);

      var status = document.getElementById("status");
      var storeLink = document.getElementById("store-link");
      storeLink.href = storeUrl;

      if (!/Android/i.test(navigator.userAgent)) {
        status.textContent = "Open this shared link on your Android phone to continue in NELOA.";
        return;
      }

      var appWasOpened = false;
      var fallbackTimer = window.setTimeout(function () {
        if (!appWasOpened && document.visibilityState !== "hidden") {
          status.textContent = "NELOA did not open. Redirecting to Google Play…";
          window.location.replace(storeUrl);
        }
      }, 1600);

      function markAppOpened() {
        if (document.visibilityState === "hidden") {
          appWasOpened = true;
          window.clearTimeout(fallbackTimer);
        }
      }

      document.addEventListener("visibilitychange", markAppOpened);
      window.addEventListener("pagehide", function () {
        appWasOpened = true;
        window.clearTimeout(fallbackTimer);
      }, { once: true });

      // Try NELOA first. Only send the user to Google Play if this page stays open.
      window.location.href = deepLink;
    }());
  </script>
</body>
</html>
